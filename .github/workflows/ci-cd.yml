# Pull requests: build the production image (type-check + vite build) without pushing it.
# Pushes to main: build -> push to GHCR -> deploy to the server over SSH -> public check.
#
# Required repository secret: DEPLOY_SSH_KEY (a private key accepted by the server's `deploy` user).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/zuarakcore/msrf-admin
  SERVER: 187.126.124.243
  APP_DIR: /srv/msrf/admin
  PUBLIC_URL: https://admin.malabarchallengersfc.com

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    concurrency:
      group: deploy-admin
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/known_hosts ~/.ssh/known_hosts
      - name: Copy deploy files
        run: scp -o StrictHostKeyChecking=yes deploy/admin/compose.yml deploy/admin/deploy.sh "deploy@$SERVER:$APP_DIR/"
      - name: Deploy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token is valid only while this job runs; the server keeps no long-lived registry password.
          printf '%s' "$TOKEN" | ssh "deploy@$SERVER" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          status=0
          ssh "deploy@$SERVER" "chmod 750 $APP_DIR/deploy.sh && $APP_DIR/deploy.sh ${{ github.sha }}" || status=$?
          ssh "deploy@$SERVER" "docker logout ghcr.io" || true
          exit $status
      - name: Public check
        run: |
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null "$PUBLIC_URL/" && exit 0
            sleep 6
          done
          exit 1
