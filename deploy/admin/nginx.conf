# Serves the built single-page app. Caddy terminates HTTPS in front of this and sets the security headers.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API on this same origin (https://admin.../api/v1 -> FastAPI on the edge network).
    # Same-origin means no CORS preflight before each request and no second TLS connection, which
    # saved a full round trip on almost every call. Caddy -> nginx -> uvicorn all sit on the edge
    # subnet that uvicorn trusts for X-Forwarded-For, so rate limits still see the real client IP.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;  # Docker DNS; resolve per request so nginx starts even if the API is down
        set $api_upstream http://msrf-api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host api.malabarchallengersfc.com;  # the API's TRUSTED_HOSTS
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Connection "";
        client_max_body_size 12m;  # matches the API's MAX_REQUEST_BYTES
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite puts a content hash in every asset name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/super-admin/..., /coach/...) all load index.html, which must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
